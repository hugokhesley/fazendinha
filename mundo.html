<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#4db8f0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mundo da Fazendinha</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#4db8f0; font-family:'Baloo 2', system-ui, sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }
  button { font:inherit; }
  [hidden] { display:none !important; }
  body:not(.jogando) #topo, body:not(.jogando) #stick, body:not(.jogando) #pular { display:none; }
  body.vestindo #stick, body.vestindo #pular, body.vestindo #missao, body.vestindo #estrelas { display:none; }
  .bt { width:64px; height:64px; border-radius:50%; border:5px solid #fff; background:#fff; cursor:pointer; padding:0;
    box-shadow:0 5px 0 rgba(0,0,0,.18), 0 10px 16px rgba(0,0,0,.14); display:flex; align-items:center; justify-content:center;
    font-size:30px; line-height:1; text-decoration:none; }
  .bt:active { transform:translateY(3px); box-shadow:0 2px 0 rgba(0,0,0,.18); }
  #topo { position:fixed; left:0; right:0; top:0; padding:12px 14px; display:flex; align-items:flex-start; justify-content:space-between;
    gap:10px; pointer-events:none; z-index:4; }
  #topo > * { pointer-events:auto; }
  .grupo { display:flex; gap:10px; align-items:center; }
  #missao { display:flex; align-items:center; gap:12px; background:#fff; border-radius:44px; padding:6px 8px 6px 16px;
    box-shadow:0 5px 0 rgba(0,0,0,.14), 0 10px 18px rgba(0,0,0,.12); min-height:68px; }
  #m-icone { font-size:38px; line-height:1; }
  #m-pontos { display:flex; gap:6px; align-items:center; font-weight:800; font-size:26px; color:#5a4632; }
  #m-pontos i { width:18px; height:18px; border-radius:50%; background:#e8dcc0; display:block; }
  #m-pontos i.ok { background:#4fbf5a; box-shadow:0 0 0 3px #c9efcd; }
  #m-ouvir { width:54px; height:54px; background:#ffcf33; border-color:#ffcf33; box-shadow:0 4px 0 #d99a00; font-size:26px; }
  #estrelas { background:#fff; border-radius:40px; padding:4px 18px 4px 12px; font-weight:800; font-size:30px; color:#f0a000;
    box-shadow:0 5px 0 rgba(0,0,0,.14); display:flex; align-items:center; gap:6px; height:64px; }
  #estrelas.pop { animation:pop .4s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { from{transform:scale(1.35)} to{transform:scale(1)} }
  #pular { position:fixed; right:28px; bottom:34px; width:118px; height:118px; border-radius:50%; border:7px solid #fff;
    background:#ff6b5e; box-shadow:0 9px 0 #c9443a, 0 18px 26px rgba(0,0,0,.22); z-index:4; cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center; }
  #pular:active, #pular.on { transform:translateY(6px); box-shadow:0 3px 0 #c9443a; }
  #stick { position:fixed; width:150px; height:150px; border-radius:50%; background:rgba(255,255,255,.35);
    border:5px solid rgba(255,255,255,.85); z-index:3; pointer-events:none; left:34px; bottom:34px; }
  #stick b { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px 0 0 -33px; border-radius:50%;
    background:#fff; box-shadow:0 5px 0 rgba(0,0,0,.18); display:block; }
  #stick.livre { opacity:.75; }
  .part { position:fixed; pointer-events:none; font-size:40px; font-weight:800; z-index:6; animation:sobe 1.2s ease-out forwards;
    text-shadow:0 2px 0 rgba(0,0,0,.15); }
  @keyframes sobe { from{transform:translate(-50%,-50%) scale(.4); opacity:1}
    to{transform:translate(calc(-50% + var(--dx)), calc(-50% - 150px)) scale(1.25); opacity:0} }
  #faixa { position:fixed; left:50%; top:24%; transform:translate(-50%,-50%) scale(0); z-index:7; pointer-events:none;
    background:#fff; border-radius:40px; padding:10px 34px; font-weight:800; font-size:clamp(28px,5vw,54px); color:#f08a1c;
    box-shadow:0 8px 0 rgba(0,0,0,.14); transition:transform .4s cubic-bezier(.3,1.6,.5,1); white-space:nowrap; }
  #faixa.on { transform:translate(-50%,-50%) scale(1); }

  .tela { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  #inicio { background:linear-gradient(rgba(77,184,240,.55), rgba(255,255,255,0) 60%); transition:opacity .5s; }
  #inicio h1 { margin:0; font-size:clamp(46px,10vw,120px); font-weight:800; color:#fff; line-height:.95; text-align:center;
    text-shadow:0 6px 0 #f08a1c, 0 14px 26px rgba(0,0,0,.22); transform:rotate(-3deg); }
  #inicio p { margin:0; background:#fff; color:#f08a1c; padding:2px 24px; border-radius:30px; font-weight:800; font-size:clamp(16px,2.6vw,26px);
    box-shadow:0 4px 0 rgba(0,0,0,.1); }
  #play { width:clamp(120px,20vw,170px); height:clamp(120px,20vw,170px); border-radius:50%; border:7px solid #fff; background:#ff6b5e;
    box-shadow:0 10px 0 #c9443a, 0 18px 30px rgba(0,0,0,.25); cursor:pointer; display:flex; align-items:center; justify-content:center;
    animation:pulsa 1.4s ease-in-out infinite; margin-top:10px; }
  @keyframes pulsa { 0%,100%{scale:1} 50%{scale:1.07} }
  #roupa { background:none; pointer-events:none; } #painel { pointer-events:auto; }
  #roupa[hidden], #inicio[hidden] { display:none; }
  #painel { background:#fff6e0; border-radius:36px; padding:18px 22px 22px; box-shadow:0 10px 0 #ecd9ac, 0 24px 40px rgba(0,0,0,.25);
    display:flex; flex-direction:column; gap:12px; max-width:92vw; margin-left:min(34vw, 420px); }
  .linha { display:flex; align-items:center; gap:10px; }
  .linha > span { font-size:34px; width:44px; text-align:center; }
  .cor { width:54px; height:54px; border-radius:50%; border:5px solid #fff; box-shadow:0 4px 0 rgba(0,0,0,.15); cursor:pointer; padding:0; font-size:26px; background:#fff; }
  .cor.sel { outline:5px solid #4fbf5a; }
  #ok { align-self:center; width:84px; height:84px; background:#4fbf5a; border-color:#fff; box-shadow:0 6px 0 #2f8f3c; font-size:40px; color:#fff; }
  @media (max-height:520px) { #painel { transform:scale(.8); } .bt { width:54px; height:54px; } #pular { width:96px; height:96px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="topo">
  <div class="grupo">
    <a class="bt" id="casa" href="index.html" aria-label="Voltar para a Fazendinha" hidden>🏠</a>
    <button class="bt" id="bt-roupa" aria-label="Mudar a roupa">👗</button>
    <button class="bt" id="bt-som" aria-label="Música">🎵</button>
    <button class="bt" id="bt-noite" aria-label="Dia ou noite">🌙</button>
  </div>
  <div id="missao">
    <span id="m-icone">⭐</span><span id="m-pontos"></span>
    <button class="bt" id="m-ouvir" aria-label="Ouvir a missão">🔊</button>
  </div>
  <div id="estrelas">⭐ <span id="n-estrelas">0</span></div>
</div>
<button id="pular" aria-label="Pular"><svg width="56%" viewBox="0 0 100 100"><path d="M50 14 L88 58 H64 V86 H36 V58 H12 Z" fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round"/></svg></button>
<div id="faixa"></div>

<div id="roupa" class="tela" hidden>
  <div id="painel">
    <div class="linha" data-k="vestido"><span>👗</span></div>
    <div class="linha" data-k="cabelo"><span>💇</span></div>
    <div class="linha" data-k="pele"><span>🙂</span></div>
    <div class="linha" data-k="enfeite"><span>✨</span></div>
    <div class="linha" style="justify-content:center; gap:26px"><button class="bt" id="novo" aria-label="Recomeçar o jogo do início">🔄</button><button class="bt" id="ok" aria-label="Pronto">✔</button></div>
  </div>
</div>

<div id="inicio" class="tela">
  <h1>Mundo da<br>Fazendinha</h1>
  <p>Explore, pule e cumpra as missões</p>
  <button id="play" aria-label="Começar"><svg width="46%" viewBox="0 0 100 100"><path d="M30 18 L84 50 L30 82 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg></button>
</div>

<script src="three.min.js"></script>
<script>
(() => {
  const T = THREE, $ = id => document.getElementById(id);
  const TEM_CASA = /*HOME*/true;
  if (TEM_CASA) $('casa').hidden = false;

  // ================= áudio e voz =================
  let ctx = null, vozPt = null, musicaOn = true;
  function escolheVoz() {
    try {
      const nota = v => { const l = (v.lang || '').replace('_', '-').toLowerCase(); if (!l.startsWith('pt')) return -1;
        let n = l === 'pt-br' ? 10 : 0; if (/natural|neural|online/i.test(v.name)) n += 8; if (/google/i.test(v.name)) n += 6;
        if (/luciana|francisca|fernanda|thalita|leticia/i.test(v.name)) n += 5; return n; };
      vozPt = speechSynthesis.getVoices().map(v => [nota(v), v]).filter(p => p[0] >= 0).sort((a, b) => b[0] - a[0])[0]?.[1] || null;
    } catch (e) {}
  }
  try { escolheVoz(); speechSynthesis.onvoiceschanged = escolheVoz; } catch (e) {}
  function fala(txt, atraso = 0) {
    setTimeout(() => { try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(txt); u.lang = 'pt-BR'; if (vozPt) u.voice = vozPt;
      u.rate = .9; u.pitch = 1.08; speechSynthesis.speak(u); } catch (e) {} }, atraso);
  }
  function tom(f1, f2, dur, tipo = 'sine', vol = .2, delay = 0, filtro = null) {
    if (!ctx) return;
    const t = ctx.currentTime + delay, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .03); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let no = o; if (filtro) { const f = ctx.createBiquadFilter(); f.type = filtro.tipo; f.frequency.value = filtro.f; f.Q.value = filtro.q || 1; o.connect(f); no = f; }
    no.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + dur + .05);
  }
  const sons = {
    vaca: () => (tom(170, 115, 1.1, 'sawtooth', .2, 0, { tipo: 'lowpass', f: 700 }), 1100),
    jumento: () => ([0, .28, .56, .84].forEach((d, i) => tom(i % 2 ? 280 : 560, i % 2 ? 240 : 500, .26, 'square', .1, d, { tipo: 'lowpass', f: 1500 })), 1150),
    porco: () => ([0, .18, .36].forEach(d => tom(230, 130, .14, 'sawtooth', .18, d, { tipo: 'bandpass', f: 600, q: 2 })), 600),
    galinha: () => ([0, .1, .2].forEach(d => tom(900, 1150, .08, 'triangle', .18, d)), tom(700, 1200, .35, 'triangle', .18, .32), 750),
    cachorro: () => ([0, .22].forEach(d => tom(520, 240, .13, 'square', .14, d, { tipo: 'lowpass', f: 1400 })), 500),
    pato: () => ([0, .2, .4].forEach(d => tom(400, 300, .16, 'sawtooth', .2, d, { tipo: 'bandpass', f: 1200, q: 5 })), 650),
  };
  const plim = (f = 880) => { tom(f, f * 1.5, .18, 'sine', .2); tom(f * 1.5, f * 2, .2, 'sine', .15, .1); };
  const piu = (v = .18) => { tom(1800, 2500, .08, 'sine', v); tom(2000, 2700, .08, 'sine', v, .12); };
  const fanfarra = () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tom(f, f, .2, 'triangle', .18, i * .14));
  const boing = () => tom(180, 620, .35, 'sine', .25);
  const pulinho = () => tom(420, 760, .16, 'sine', .12);
  const splash = () => { tom(900, 120, .4, 'sawtooth', .12, 0, { tipo: 'lowpass', f: 900 }); tom(300, 80, .5, 'sine', .15, .05); };
  const estouro = () => { tom(700, 70, .12, 'square', .18); tom(1400, 200, .08, 'triangle', .15); };
  // musiquinha de fundo
  const MEL = [523, 659, 784, 659, 587, 698, 880, 698, 523, 659, 784, 1047, 880, 784, 659, 587];
  let passoMus = 0;
  setInterval(() => { if (!ctx || !musicaOn || !rodando || document.hidden) return;
    const f = MEL[passoMus % MEL.length]; tom(f, f, .28, 'triangle', .035); if (passoMus % 4 === 0) tom(f / 4, f / 4, .5, 'sine', .06); passoMus++; }, 330);

  // ================= cena =================
  const canvas = $('c');
  const renderer = new T.WebGLRenderer({ canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.6));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
  const scene = new T.Scene();
  { const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const g = cv.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#3fa8ee'); gr.addColorStop(.5, '#9adcf8'); gr.addColorStop(.78, '#e6f6f4'); gr.addColorStop(1, '#fdf0c8');
    g.fillStyle = gr; g.fillRect(0, 0, 4, 256); scene.background = new T.CanvasTexture(cv); }
  const ceuDia = scene.background;
  const ceuNoite = (() => { const cv = document.createElement('canvas'); cv.width = 4; cv.height = 256; const g = cv.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
    gr.addColorStop(0, '#10134a'); gr.addColorStop(.6, '#3a3f8f'); gr.addColorStop(1, '#8a6fb0'); g.fillStyle = gr; g.fillRect(0, 0, 4, 256); return new T.CanvasTexture(cv); })();
  scene.fog = new T.Fog(0xdaf2f6, 80, 230);
  const camera = new T.PerspectiveCamera(50, 1, 1, 420);
  const hemi = new T.HemisphereLight(0xffffff, 0x9ad07a, .78); scene.add(hemi);
  const sol = new T.DirectionalLight(0xfff0cc, .62);
  sol.castShadow = true; sol.shadow.mapSize.set(1024, 1024);
  Object.assign(sol.shadow.camera, { left: -34, right: 34, top: 34, bottom: -34, near: 1, far: 120 }); sol.shadow.bias = -.0008; sol.shadow.normalBias = .06;
  scene.add(sol); scene.add(sol.target);

  const GEO = { sphere: new T.SphereGeometry(1, 24, 16), box: new T.BoxGeometry(1, 1, 1), cyl: new T.CylinderGeometry(1, 1, 1, 22),
    cone: new T.ConeGeometry(1, 1, 22), cone4: new T.ConeGeometry(1, 1, 4), ico: new T.IcosahedronGeometry(1, 0), circ: new T.CircleGeometry(1, 48) };
  const mats = {};
  const mat = c => mats[c] || (mats[c] = new T.MeshLambertMaterial({ color: c }));
  function add(p, g, c, pos, sc, rot, sombra = true) {
    const m = new T.Mesh(GEO[g] || g, typeof c === 'object' ? c : mat(c));
    m.position.set(pos[0], pos[1], pos[2]); if (sc) m.scale.set(sc[0], sc[1], sc[2]); if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
    m.castShadow = sombra; m.receiveShadow = true; p.add(m); return m;
  }
  const chao = (c, x, z, r, y = .02, sz = 1) => { const m = add(scene, 'circ', c, [x, y, z], [r, r * sz, 1], [-Math.PI / 2, 0, 0], false); return m; };
  let semente = 11;
  const rng = () => { semente |= 0; semente = semente + 0x6D2B79F5 | 0; let t = Math.imul(semente ^ semente >>> 15, 1 | semente);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };

  // ---------- mar e ilhas ----------
  const R = 62, ILHA2 = { x: 106, z: 8, r: 10 };
  const mar = add(scene, 'circ', new T.MeshLambertMaterial({ color: 0x35a3e6 }), [0, -1.1, 0], [520, 520, 1], [-Math.PI / 2, 0, 0], false);
  let ondasTex;
  { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g = cv.getContext('2d');
    g.strokeStyle = 'rgba(255,255,255,.55)'; g.lineWidth = 5; g.lineCap = 'round';
    for (let i = 0; i < 9; i++) { const x = (i * 97) % 256, y = (i * 61) % 256; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x + 18, y - 12, x + 36, y); g.stroke(); }
    ondasTex = new T.CanvasTexture(cv); ondasTex.wrapS = ondasTex.wrapT = T.RepeatWrapping; ondasTex.repeat.set(46, 46);
    add(scene, 'circ', new T.MeshBasicMaterial({ map: ondasTex, transparent: true, depthWrite: false }), [0, -1.0, 0], [520, 520, 1], [-Math.PI / 2, 0, 0], false); }
  function ilha(x, z, r) {
    add(scene, 'cyl', '#e8d3a0', [x, -1.3, z], [r + 3.2, 2.2, r + 3.2], null, false);
    add(scene, 'cyl', '#8a6a44', [x, -3, z], [r + .2, 4.4, r + .2], null, false);
    const topo = add(scene, 'cyl', '#7fd05a', [x, -.5, z], [r, 1, r], null, false); topo.receiveShadow = true;
  }
  ilha(0, 0, R); ilha(ILHA2.x, ILHA2.z, ILHA2.r);
  // manchas de grama e caminhos
  for (let i = 0; i < 26; i++) { const a = rng() * 6.283, d = rng() * (R - 10); chao(i % 2 ? '#8ad865' : '#72c44f', Math.cos(a) * d, Math.sin(a) * d, 4 + rng() * 6, .03 + i * .004); }
  const caminho = (x1, z1, x2, z2, w = 3.2) => { const dx = x2 - x1, dz = z2 - z1, L = Math.hypot(dx, dz);
    const m = add(scene, 'box', '#ecd9a6', [(x1 + x2) / 2, .14, (z1 + z2) / 2], [w, .05, L + w * .6], [0, Math.atan2(dx, dz), 0], false); return m; };
  caminho(0, 8, 0, -22); caminho(0, 8, 46, 8); caminho(0, 8, -30, 9); caminho(0, 6, 15, -5); caminho(-2, 9, -15, 13);
  chao('#ecd9a6', 0, 8, 5.5, .175);

  // ---------- natureza ----------
  const obst = [], arvs = [];                       // círculos sólidos {x,z,r}
  const livres = [[0, 8, 9], [24, -6, 13], [0, -34, 15], [-34, 12, 13], [-10, -6, 8], [-18, 15, 7], [50, 8, 12], [24, 8, 26, 1], [-28, -20, 8], [-18, 49, 14], [36, 34, 6], [-8, 28, 10], [-12, 8.6, 14, 1]];
  const ocupado = (x, z, folga) => livres.some(l => l[3] ? (Math.abs(x - l[0]) < l[2] && Math.abs(z - l[1]) < 4) : Math.hypot(x - l[0], z - l[1]) < l[2] + folga)
    || obst.some(o => Math.hypot(x - o.x, z - o.z) < o.r + folga + 1.5);
  function arvore(x, z, s = 1, tipo = 0) {
    const g = new T.Group(); g.position.set(x, 0, z); scene.add(g);
    if (tipo === 2) {            // pinheiro
      add(g, 'cyl', '#9b6a3c', [0, .9 * s, 0], [.32 * s, 1.8 * s, .32 * s]);
      [[1.9, 2.2, 2.4], [1.5, 2, 3.7], [1.05, 1.8, 4.9]].forEach(([r, h, y], i) => add(g, 'cone', i % 2 ? '#3f9e45' : '#358c3e', [0, y * s, 0], [r * s, h * s, r * s]));
    } else {
      add(g, 'cyl', '#9b6a3c', [0, 1.2 * s, 0], [.38 * s, 2.4 * s, .38 * s]);
      add(g, 'sphere', '#4fae4a', [0, 3.5 * s, 0], [2 * s, 1.8 * s, 2 * s]);
      add(g, 'sphere', '#3f9e45', [-1.2 * s, 2.9 * s, .3 * s], [1.3 * s, 1.2 * s, 1.3 * s]);
      add(g, 'sphere', '#63c25a', [1.1 * s, 3.1 * s, -.2 * s], [1.3 * s, 1.2 * s, 1.3 * s]);
      add(g, 'sphere', '#63c25a', [.2 * s, 4.5 * s, .2 * s], [1.2 * s, 1 * s, 1.2 * s]);
      if (tipo === 1) [[-1.3, 2.6, 1.1], [1.2, 2.9, 1.2], [.1, 3.2, 1.9], [-.5, 4.3, 1.2]].forEach(([fx, fy, fz], i) => {
        add(g, 'sphere', i % 2 ? '#ffc21a' : '#f04a3a', [fx * s, fy * s, fz * s], [.2 * s, .27 * s, .2 * s]); });
    }
    obst.push({ x, z, r: .7 * s }); arvs.push({ g, x, z });
  }
  for (let i = 0, n = 0; i < 400 && n < 16; i++) { const x = 30 + (rng() - .5) * 30, z = -32 + (rng() - .5) * 26; if (Math.hypot(x, z) > R - 5 || ocupado(x, z, 1.5)) continue; arvore(x, z, .9 + rng() * .5, n % 3); n++; }
  for (let i = 0, n = 0; i < 600 && n < 26; i++) { const a = rng() * 6.283, d = 14 + rng() * (R - 19), x = Math.cos(a) * d, z = Math.sin(a) * d; if (ocupado(x, z, 2)) continue; arvore(x, z, .8 + rng() * .6, n % 4 === 0 ? 2 : n % 3 === 0 ? 1 : 0); n++; }

      b.g.rotation.y = Math.atan2(x - b.g.position.x, z - b.g.position.z); b.g.position.set(x, y, z); b.asas[0].rotation.z = Math.sin(tempo * 18 + b.f) * .9; b.asas[1].rotation.z = -b.asas[0].rotation.z;
      if (dist2(pos, x, z) < 1.5 && Math.abs(pos.y + 1.2 - y) < 1.9) { b.pega = true; b.g.visible = false; nBorb++; plim(1200); confete3d(x, y, z, ['✦', '♥'], ['#ff8c1a', '#7fb4ff', '#ff7ab6']); confere(); } });
    // ---- arcos da corrida ----
    const naCorrida = !trocando && MISSOES[iMissao].ic === '🚜';
    arcos.forEach((a, i) => { a.m.visible = naCorrida && i >= iArco; if (!a.m.visible) return; const prox = i === iArco; a.m.material.color.set(prox ? 0xffcf33 : 0xe8dcc0); a.m.scale.setScalar(prox ? 1 + Math.sin(tempo * 5) * .06 : .9);
      if (prox && dirigindo && dist2(pos, a.x, a.z) < 2.9) { iArco++; plim(700 + iArco * 90); confete3d(a.x, 3, a.z, ['★'], ['#ffcf33']); confere(); } });
    // ---- conchas e estrela do céu ----
    conchas.forEach((c, i) => { if (c.pega) return; c.g.rotation.y = tempo + i; if (dist2(pos, c.g.position.x, c.g.position.z) < 1.3 && pos.y < 1.5) { c.pega = true; c.g.visible = false; nCon++; plim(1000 + i * 40);
      confete3d(c.g.position.x, 1, c.g.position.z, ['✦'], ['#ffd1e0', '#fff']); confere(); } });
    estrelaCeu.rotation.y = tempo * 1.5;
    if (estrelaCeu.visible && dist2(pos, 6, 26) < 2.6 && pos.y > 15) { estrelaCeu.visible = false; ceuFeito = true; nEstrelas++; pegouEstrela(estrelaCeu.position); fala('Você pegou a estrela do céu!', 300); }
    // ---- seta, farol, nuvens, mar ----
    const alvo = trocando ? null : MISSOES[iMissao].alvo();
    if (alvo) { const d = dist2(pos, alvo.x, alvo.z); farol.visible = true; farol.position.set(alvo.x, 20, alvo.z); farol.material.opacity = .2 + Math.sin(tempo * 3) * .08;
      seta.visible = d > 7; seta.position.set(pos.x, pos.y + 3.7 + Math.sin(tempo * 4) * .12, pos.z); seta.rotation.y = Math.atan2(alvo.x - pos.x, alvo.z - pos.z); }
    else { farol.visible = seta.visible = false; }
    nuvens.forEach((n, i) => { n.position.x += dt * (.6 + i * .08); if (n.position.x > 190) n.position.x = -170; });
    ondasTex.offset.x = tempo * .006; ondasTex.offset.y = Math.sin(tempo * .3) * .01;
    // ---- câmera e luz ----
    const retrato = innerHeight > innerWidth, cy = retrato ? 17 : 10.5, cz = retrato ? 22 : 14.5;
    v3.set(pos.x, Math.max(pos.y, 0) + cy, pos.z + cz); camera.position.lerp(v3, Math.min(1, 5 * dt));
    camera.lookAt(camera.position.x, camera.position.y - cy + 1.6, camera.position.z - cz);
    sol.position.set(pos.x + 22, 38, pos.z + 16); sol.target.position.set(pos.x, 0, pos.z);
  }
  function pegouEstrela(p) {
    plim(880 + (nEstrelas % 5) * 110); confete3d(p.x, p.y, p.z, ['★', '✦'], ['#ffcf33', '#ffe680', '#fff']);
    $('n-estrelas').textContent = nEstrelas; const e = $('estrelas'); e.classList.remove('pop'); void e.offsetWidth; e.classList.add('pop'); confere();
  }

  // ================= laço principal =================
  function ajusta() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.fov = innerHeight > innerWidth ? 62 : 50; camera.updateProjectionMatrix(); }
  addEventListener('resize', ajusta); ajusta();
  camera.position.set(0, 14, 30);
  let ultimo = performance.now(), vestindo = false;
  function quadro(agora) {
    const dt = Math.min(.05, (agora - ultimo) / 1000); ultimo = agora;
    if (rodando) atualiza(dt);
    else if (vestindo) { tempo += dt; av.position.copy(pos); av.rotation.y = Math.sin(tempo * 1.1) * .7; farol.visible = seta.visible = false;
      const lado = innerWidth > innerHeight ? 2.4 : 0; camera.position.set(pos.x + lado, pos.y + 2.6, pos.z + 7.5); camera.lookAt(pos.x + lado, pos.y + 1.5, pos.z); sol.position.set(pos.x + 22, 38, pos.z + 16); sol.target.position.set(pos.x, 0, pos.z); }
    else { tempo += dt; const a = tempo * .12; camera.position.set(Math.sin(a) * 34, 16, 8 + Math.cos(a) * 34); camera.lookAt(0, 2, 0); sol.position.set(22, 38, 24); sol.target.position.set(0, 0, 0);
      estrelas.forEach((e, i) => { e.m.rotation.y = tempo * 2 + i; }); av.position.copy(pos); farol.visible = seta.visible = false; }
    if (!window.__semRender) renderer.render(scene, camera);
    requestAnimationFrame(quadro);
  }
  requestAnimationFrame(quadro);

  // ================= telas =================
  function telaCheia() { try { const d = document.documentElement, p = (d.requestFullscreen || d.webkitRequestFullscreen)?.call(d); if (p && p.catch) p.catch(() => {}); screen.orientation?.lock?.('landscape').catch(() => {}); } catch (e) {} }
  $('play').addEventListener('click', () => {
    try { ctx = new (window.AudioContext || window.webkitAudioContext)(); ctx.resume(); } catch (e) {}
    telaCheia(); const ini = $('inicio'); ini.style.opacity = 0; setTimeout(() => ini.hidden = true, 500);
    rodando = true; document.body.classList.add('jogando'); ultimo = performance.now(); fanfarra();
    fala((temSave ? 'Bem-vinda de volta! ' : 'Bem-vinda ao Mundo da Fazendinha! ') + MISSOES[iMissao].fala, 600); confere();
  });
  $('m-ouvir').addEventListener('click', () => fala(MISSOES[iMissao].fala));
  $('bt-noite').addEventListener('click', () => { trocaNoite(); $('bt-noite').textContent = noite ? '☀️' : '🌙'; });
  $('bt-som').addEventListener('click', () => { musicaOn = !musicaOn; $('bt-som').style.opacity = musicaOn ? 1 : .45; });
  // painel de roupa
  document.querySelectorAll('#painel .linha[data-k]').forEach(l => { const k = l.dataset.k;
    LOOK[k].forEach((v, i) => { const b = document.createElement('button'); b.className = 'cor'; b.setAttribute('aria-label', k + ' ' + (i + 1));
      if (k === 'enfeite') b.textContent = v; else b.style.background = v;
      b.addEventListener('click', () => { visual[k] = i; aplicaVisual(); marca(); plim(700 + i * 60); }); l.appendChild(b); }); });
  function marca() { document.querySelectorAll('#painel .linha[data-k]').forEach(l => [...l.querySelectorAll('.cor')].forEach((b, i) => b.classList.toggle('sel', visual[l.dataset.k] === i))); }
  let voltaRodar = false;
  $('bt-roupa').addEventListener('click', () => { if (vestindo) return; marca(); $('roupa').hidden = false; voltaRodar = rodando; rodando = false; vestindo = true; document.body.classList.add('vestindo'); });
  let tNovo = 0;
  $('novo').addEventListener('click', () => { if (Date.now() - tNovo < 4000) { try { localStorage.removeItem(SAVE); } catch (e) {} location.reload(); return; }
    tNovo = Date.now(); $('novo').textContent = '❓'; fala('Quer começar tudo de novo? Toque outra vez para confirmar.'); setTimeout(() => { $('novo').textContent = '🔄'; }, 4000); });
  $('ok').addEventListener('click', () => { $('roupa').hidden = true; vestindo = false; document.body.classList.remove('vestindo'); rodando = voltaRodar; ultimo = performance.now(); });
  if (location.hash === '#teste') window.__m = {
    passo(n, ix, iz, pula) { for (let i = 0; i < n; i++) { stick.x = ix; stick.z = iz; if (pula && i === 0) querPular = true; atualiza(1 / 60); } stick.x = stick.z = 0; },
    vai(x, y, z) { pos.set(x, y, z); vel.set(0, 0, 0); destino.on = false; },
    toque(x, z) { destino.on = true; destino.id = null; destino.x = x; destino.z = z; destino.parado = 0; },
    livre(n) { for (let i = 0; i < n; i++) atualiza(1 / 60); },
    chao(x, z) { return alturaChao(x, z, pos.y + 2.2)[0]; },
    estado() { const a = trocando ? null : MISSOES[iMissao].alvo(); return { m: iMissao, trocando, n: nEstrelas, nb: nBaloes, check, dirigindo, noChao, x: pos.x, y: pos.y, z: pos.z, alvo: a ? [a.x, a.z] : null, nCen, nBorb, iArco, nCon, ceuFeito, levando, destino: destino.on,
      chaoFrente: alturaChao(pos.x + 1.3, pos.z, pos.y)[0], baloes: baloes.filter(b => b.g.visible).map(b => [b.g.position.x, b.g.position.y, b.g.position.z]), vistos: bichos.filter(b => b.visto).length, pintos: pintos.filter(p => p.segue).length, entregues, obbyFeito }; },
    pulaTroca() { if (trocando) { iMissao++; trocando = false; desenhaMissao(); } },
  };
})();
</script>
