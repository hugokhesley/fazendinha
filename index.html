<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#63c5f2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fazendinha">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Bichinhos do Brasil – Fazendinha (protótipo)</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
  :root { --ceu1:#7fd3ff; --ceu2:#c9f0ff; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; overflow:hidden; background:#7fd3ff;
    font-family:'Baloo 2', system-ui, sans-serif; user-select:none; -webkit-user-select:none;
    touch-action:none; overscroll-behavior:none; }
  #cena { position:fixed; inset:0; width:100%; height:100%; display:block; }
  .ceu-top { stop-color:var(--ceu1); transition:stop-color 1.5s; }
  .ceu-bot { stop-color:var(--ceu2); transition:stop-color 1.5s; }
  body.noite { --ceu1:#0d1b4a; --ceu2:#3a3f8f; background:#0d1b4a; }
  #estrelas { opacity:0; transition:opacity 1.5s; }
  body.noite #estrelas { opacity:1; }
  #sol { cursor:pointer; transition:opacity 1s; }
  #lua { opacity:0; transition:opacity 1s; pointer-events:none; }
  body.noite #sol .raios, body.noite #sol .disco { opacity:0; }
  body.noite #lua { opacity:1; }
  #sol .raios, #sol .disco { transition:opacity 1s; }
  .escurece { transition:opacity 1.5s; opacity:0; pointer-events:none; }
  body.noite .escurece { opacity:.35; }
  .zzz { opacity:0; transition:opacity 1s; font-weight:800; fill:#fff; font-size:34px; }
  body.noite .zzz { opacity:1; animation:zz 2.4s ease-in-out infinite; }
  @keyframes zz { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

  .bicho { cursor:pointer; }
  .vivo, .corpo, .flor, .ovo { transform-box:fill-box; transform-origin:50% 100%; }
  .vivo { animation:respira 3s ease-in-out infinite; }
  @keyframes respira { 0%,100%{transform:scale(1,1)} 50%{transform:scale(1.015,1.03)} }
  .corpo.pula { animation:pula .7s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pula {
    0%{transform:scale(1,1) translateY(0)}
    15%{transform:scale(1.15,.85) translateY(0)}
    45%{transform:scale(.92,1.12) translateY(-45px)}
    70%{transform:scale(1.08,.92) translateY(0)}
    100%{transform:scale(1,1) translateY(0)}
  }
  .boia { animation:boia 2.6s ease-in-out infinite; }
  @keyframes boia { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-8px) rotate(2deg)} }
  .nuvem { cursor:pointer; }
  .nuvem-move { animation:nuvem 18s ease-in-out infinite alternate; }
  @keyframes nuvem { from{transform:translateX(-30px)} to{transform:translateX(40px)} }
  .flor { animation:cresce .6s cubic-bezier(.3,1.6,.5,1) both; }
  @keyframes cresce { from{transform:scale(0)} to{transform:scale(1)} }
  .ovo { animation:cresce .5s cubic-bezier(.3,1.6,.5,1) both; }

  .particula { position:fixed; pointer-events:none; font-weight:800; font-size:44px;
    animation:sobe 1.3s ease-out forwards; text-shadow:0 2px 0 rgba(0,0,0,.15); z-index:20; }
  @keyframes sobe { from{transform:translate(-50%,-50%) scale(.4); opacity:1}
    to{transform:translate(calc(-50% + var(--dx)), calc(-50% - 160px)) scale(1.3); opacity:0} }
  .gota { position:fixed; width:8px; height:22px; border-radius:6px; background:#4aa8ff;
    pointer-events:none; animation:cai 1s linear forwards; z-index:4; }
  @keyframes cai { from{transform:translateY(0); opacity:1} to{transform:translateY(55vh); opacity:.2} }

  #inicio { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:18px; background:linear-gradient(#7fd3ff,#bff0a0); z-index:10;
    transition:opacity .6s; }
  #inicio h1 { margin:0; font-size:clamp(40px,8vw,90px); color:#fff; font-weight:800;
    text-shadow:0 5px 0 #2a8c3c, 0 8px 18px rgba(0,0,0,.2); letter-spacing:1px; text-align:center; line-height:1; }
  #inicio p { margin:0; color:#1f5f2c; font-size:clamp(18px,3vw,26px); font-weight:600; }
  #play { width:clamp(130px,22vw,190px); height:clamp(130px,22vw,190px); border-radius:50%; border:none;
    background:#ffcf33; box-shadow:0 10px 0 #d99a00, 0 16px 30px rgba(0,0,0,.25); cursor:pointer;
    display:flex; align-items:center; justify-content:center; animation:pulsa 1.4s ease-in-out infinite; }
  #play:active { transform:translateY(8px); box-shadow:0 2px 0 #d99a00; }
  @keyframes pulsa { 0%,100%{scale:1} 50%{scale:1.08} }
  /* ---------- modo aprender ---------- */
  #btn-aprender { position:fixed; left:14px; top:14px; z-index:6; width:72px; height:72px; border-radius:50%;
    border:none; background:#ffcf33; box-shadow:0 6px 0 #d99a00; cursor:pointer; font-size:40px; color:#fff;
    text-shadow:0 2px 0 #d99a00; line-height:1; }
  #aprender { position:fixed; inset:0; z-index:8; display:flex; flex-direction:column;
    background:linear-gradient(#bfe9ff,#e9ffd9); }
  #aprender[hidden] { display:none; }
  #barra { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; gap:12px; }
  .redondo { width:64px; height:64px; border-radius:50%; border:none; background:#fff;
    box-shadow:0 5px 0 rgba(0,0,0,.15); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:none; }
  #pergunta { display:flex; align-items:center; gap:14px; background:#fff; border-radius:44px;
    padding:6px 8px 6px 18px; box-shadow:0 5px 0 rgba(0,0,0,.12); min-height:76px; }
  #dica svg { height:60px; width:60px; display:block; }
  #ouvir { background:#ffcf33; }
  #estrelas-jogo { font-size:38px; color:rgba(0,0,0,.15); letter-spacing:2px; white-space:nowrap; }
  #estrelas-jogo .on { color:#ffb800; }
  #aprender.menu #pergunta, #aprender.menu #estrelas-jogo { visibility:hidden; }
  #aprender.menu #opcoes, #aprender:not(.menu) #menu-jogos { display:none; }
  #opcoes, #menu-jogos { flex:1; display:flex; align-items:center; justify-content:center; gap:3vw;
    padding:1vh 3vw 6vh; flex-wrap:wrap; min-height:0; }
  .cartao { width:min(calc(82vw / var(--n, 4)), 58vh); aspect-ratio:1; background:#fff; border:none; border-radius:32px;
    box-shadow:0 10px 0 rgba(0,0,0,.13); padding:1.2%; cursor:pointer; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font:inherit; font-weight:800; font-size:clamp(16px,2.4vw,28px);
    color:#356; transition:opacity .3s; }
  .cartao svg { width:86%; flex:1; min-height:0; overflow:visible; pointer-events:none; }
  .cartao.errou { animation:nao .5s; opacity:.4; pointer-events:none; }
  @keyframes nao { 0%,100%{translate:0} 25%{translate:-12px} 75%{translate:12px} }
  @media (orientation:portrait) { .cartao { width:min(42vw,32vh); } }

  #tela-cheia { position:fixed; right:14px; top:14px; z-index:6; width:52px; height:52px; border-radius:14px;
    border:none; background:rgba(255,255,255,.65); font-size:26px; cursor:pointer; color:#245; }

  /* ===== direção de arte v2: papel recortado ===== */
  :root { --ceu1:#63c5f2; --ceu2:#fdf3cf; }
  body.noite { --ceu1:#171a52; --ceu2:#4a3f8c; background:#171a52; }
  .raios { transform-box:fill-box; transform-origin:center; animation:gira 50s linear infinite; }
  @keyframes gira { to { transform:rotate(360deg); } }
  .olho { transform-box:fill-box; transform-origin:center; animation:pisca 4.5s infinite; }
  @keyframes pisca { 0%,93%,100%{transform:scaleY(1)} 96%{transform:scaleY(.1)} }
  body.noite .olho { animation:none; transform:scaleY(.12); }
  .abana { transform-box:fill-box; transform-origin:0% 100%; animation:abana .5s ease-in-out infinite alternate; }
  @keyframes abana { from{transform:rotate(-7deg)} to{transform:rotate(9deg)} }
  .zzz { fill:#fff; }

  #inicio { background:linear-gradient(#63c5f2 0%, #d8f1ee 58%, #8fd66a 58%, #6bbf4b 100%); gap:10px;
    overflow:hidden; padding-bottom:20vh; }
  #inicio h1 { font-size:clamp(52px,11vw,132px); text-shadow:0 6px 0 #f08a1c, 0 14px 24px rgba(0,0,0,.18);
    transform:rotate(-3deg); }
  #inicio p { background:#fff; color:#f08a1c; padding:2px 24px; border-radius:30px; font-weight:800;
    box-shadow:0 4px 0 rgba(0,0,0,.1); }
  #play { background:#ff6b5e; box-shadow:0 10px 0 #c9443a, 0 18px 30px rgba(0,0,0,.22); margin-top:12px;
    border:6px solid #fff; }
  #play:active { box-shadow:0 2px 0 #c9443a; }
  #inicio-bichos { position:absolute; left:0; right:0; bottom:3vh; display:flex; justify-content:space-evenly;
    align-items:flex-end; pointer-events:none; }
  #inicio-bichos svg { height:24vh; width:auto; overflow:visible; }
  #inicio-bichos svg:nth-child(2), #inicio-bichos svg:nth-child(4) { height:17vh; }

  #tela-cheia { border-radius:50%; width:56px; height:56px; background:#fff; box-shadow:0 5px 0 rgba(0,0,0,.15);
    display:flex; align-items:center; justify-content:center; }
  #btn-aprender { width:78px; height:78px; border:6px solid #fff; box-shadow:0 6px 0 #d99a00, 0 12px 18px rgba(0,0,0,.15); }

  #aprender { background:
    radial-gradient(circle at 10% 22%, #ffe3a3 0 13vw, transparent 13.1vw),
    radial-gradient(circle at 90% 84%, #c9ecc0 0 18vw, transparent 18.1vw),
    radial-gradient(circle at 78% 6%, #cfe9ff 0 11vw, transparent 11.1vw),
    #fff6e0; }
  .redondo, #pergunta { box-shadow:0 5px 0 #ecd9ac; }
  #ouvir { box-shadow:0 5px 0 #d99a00; }
  .cartao { border:6px solid #fff; border-radius:40px; color:#5a4632; background:#e6f1f8;
    box-shadow:0 10px 0 #ecd9ac, 0 20px 28px rgba(120,90,20,.12); }
  #menu-jogos .cartao:nth-child(1) { background:#ffe1e6; }
  #menu-jogos .cartao:nth-child(2) { background:#fff0bf; }
  #menu-jogos .cartao:nth-child(3) { background:#d9f2d0; }
  #menu-jogos .cartao:nth-child(4) { background:#d6ecff; }
  #estrelas-jogo span { display:inline-block; color:#e6d6ac; }
  #estrelas-jogo .nova { animation:pop .5s cubic-bezier(.3,1.8,.5,1); }
  @keyframes pop { from{transform:scale(0) rotate(-90deg)} to{transform:scale(1) rotate(0)} }
  @media (prefers-reduced-motion: reduce) { .raios, .nuvem-move, .abana { animation:none; } }

  /* ===== letras, números e contorno ===== */
  #menu-jogos { gap:2.4vw; align-content:center; }
  #menu-jogos .cartao { width:min(19vw,36vh); font-size:clamp(13px,2vw,24px); white-space:nowrap; border-radius:32px; }
  #menu-jogos .cartao:nth-child(5) { background:#e9defa; }
  #menu-jogos .cartao:nth-child(6) { background:#ffe6cc; }
  #menu-jogos .cartao:nth-child(7) { background:#d5f3ee; }
  #menu-jogos .cartao:nth-child(8) { background:#fde0ef; }
  #tracar { flex:1; display:flex; align-items:center; justify-content:center; gap:6vw; padding:0 4vw 5vh; min-height:0; }
  #aprender.menu #tracar, #aprender:not(.tracando) #tracar, #aprender.tracando #opcoes { display:none; }
  #quadro { background:#fff; border-radius:40px; box-shadow:0 10px 0 #ecd9ac, 0 20px 28px rgba(120,90,20,.12);
    padding:2vh; height:min(74vh,66vw); aspect-ratio:100/120; touch-action:none; }
  #glifo { width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .t-base { fill:none; stroke:#efe6d2; stroke-width:17; stroke-linecap:round; stroke-linejoin:round; }
  .t-feito { fill:none; stroke-width:17; stroke-linecap:round; stroke-linejoin:round; }
  .t-guia { fill:none; stroke:#a8946a; stroke-width:2.5; stroke-linecap:round; stroke-dasharray:.1 6; }
  .t-ponto { fill:#ffcf33; stroke:#fff; stroke-width:2.5; animation:pulsa 1s ease-in-out infinite;
    transform-box:fill-box; transform-origin:center; pointer-events:none; }
  .t-mini { fill:none; stroke:#2f9bd6; stroke-width:7; stroke-linecap:round; stroke-dasharray:.1 12; }
  #premio { font-size:min(24vh,20vw); line-height:1; width:min(34vh,28vw); text-align:center; }
  #premio svg { width:100%; overflow:visible; display:block; }
  #premio.salta { animation:pula .7s cubic-bezier(.3,1.6,.5,1); }
  @media (orientation:portrait) {
    #menu-jogos .cartao { width:min(40vw,19vh); }
    #tracar { flex-direction:column; gap:2vh; } #quadro { height:min(58vh,105vw); }
    #premio { font-size:14vh; width:26vh; }
  }

  /* ===== v3: vida no cenário, módulo Brincar ===== */
  .luz-sol { transition:opacity 1.5s; } body.noite .luz-sol { opacity:0; }
  .passaro { animation:passa 46s linear infinite; } .passaro.p2 { animation-duration:62s; animation-delay:-20s; }
  @keyframes passa { from{transform:translate(-80px,230px)} 50%{transform:translate(800px,170px)} to{transform:translate(1700px,250px)} }
  body.noite .passaro, body.noite .voa { opacity:0; } .passaro, .voa { transition:opacity 1s; }
  .voa.v1 { animation:voa1 19s ease-in-out infinite; } .voa.v2 { animation:voa2 23s ease-in-out infinite; }
  @keyframes voa1 { 0%,100%{transform:translate(260px,640px)} 25%{transform:translate(470px,560px)} 50%{transform:translate(770px,650px)} 75%{transform:translate(590px,740px)} }
  @keyframes voa2 { 0%,100%{transform:translate(1420px,560px)} 30%{transform:translate(1180px,470px)} 60%{transform:translate(1060px,620px)} 80%{transform:translate(1330px,640px)} }
  .asas { transform-box:fill-box; transform-origin:center; animation:bate .28s ease-in-out infinite alternate; }
  @keyframes bate { from{transform:scaleX(1)} to{transform:scaleX(.25)} }
  .vagalumes { opacity:0; transition:opacity 1.5s; } body.noite .vagalumes { opacity:1; }
  .vagalumes circle { animation:brilha 2.4s ease-in-out infinite; }
  .vagalumes circle:nth-child(2n) { animation-delay:-.8s; } .vagalumes circle:nth-child(3n) { animation-delay:-1.6s; }
  @keyframes brilha { 0%,100%{opacity:.15} 50%{opacity:1} }

  #btn-brincar { position:fixed; left:106px; top:14px; z-index:6; width:78px; height:78px; border-radius:50%;
    border:6px solid #fff; background:#4fbf5a; box-shadow:0 6px 0 #2f8f3c, 0 12px 18px rgba(0,0,0,.15); cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0; }
  #menu-jogos.m-brincar .cartao { width:min(20vw,54vh); font-size:clamp(15px,2.3vw,28px); }
  #arena { flex:1; position:relative; min-height:0; margin:0 3vw 4vh; border-radius:40px; overflow:hidden;
    touch-action:none; box-shadow:0 10px 0 #ecd9ac; }
  #aprender:not(.arena) #arena, #aprender.arena #opcoes { display:none; }
  .a-pega { background:radial-gradient(circle at 18% 28%, #a3e27f 0 8vw, transparent 8.1vw),
    radial-gradient(circle at 76% 72%, #a3e27f 0 11vw, transparent 11.1vw), radial-gradient(circle at 60% 20%, #79c653 0 6vw, transparent 6.1vw), #86d360; }
  .a-labirinto { background:radial-gradient(circle at 12% 80%, #8fd866 0 9vw, transparent 9.1vw), radial-gradient(circle at 88% 16%, #8fd866 0 8vw, transparent 8.1vw), #74c44e; }
  .a-baloes { background:radial-gradient(ellipse at 20% 24%, #fff 0 6vw, transparent 6.1vw), radial-gradient(ellipse at 27% 21%, #fff 0 5vw, transparent 5.1vw),
    radial-gradient(ellipse at 74% 40%, #fff 0 5vw, transparent 5.1vw), radial-gradient(ellipse at 80% 37%, #fff 0 4vw, transparent 4.1vw), linear-gradient(#63c5f2,#d9f3ff); }
  .a-memoria { background:#fde4b4; }
  .fujao { position:absolute; width:min(22vh,18vw); aspect-ratio:1; background:none; border:none; padding:0; cursor:pointer;
    transition:left linear, top linear; }
  .fujao svg { width:100%; height:100%; overflow:visible; pointer-events:none; animation:saltita .4s ease-in-out infinite alternate; }
  @keyframes saltita { from{transform:translateY(0)} to{transform:translateY(-9%)} }
  .fujao.pego svg { animation:giro .7s; }
  @keyframes giro { 50%{transform:rotate(180deg) scale(1.3)} to{transform:rotate(360deg) scale(1)} }
  .balao { position:absolute; top:100%; width:min(19vh,15vw); background:none; border:none; padding:0; cursor:pointer;
    animation:sobeBalao linear forwards; }
  .balao svg { width:100%; display:block; pointer-events:none; }
  @keyframes sobeBalao { to{transform:translateY(-130vh)} }
  .treme { animation:nao .5s; }
  .grade-mem { position:absolute; inset:0; display:grid; grid-template-columns:repeat(var(--col), auto); gap:2.6vh 2vw;
    align-content:center; justify-content:center; }
  .carta { width:min(calc(70vw / var(--col)), calc(60vh / var(--lin))); aspect-ratio:1; position:relative; background:none;
    border:none; padding:0; cursor:pointer; transform-style:preserve-3d; transition:transform .4s; }
  .carta.virada { transform:rotateY(180deg); }
  .carta .verso, .carta .frente { position:absolute; inset:0; border-radius:24px; backface-visibility:hidden;
    -webkit-backface-visibility:hidden; box-shadow:0 6px 0 rgba(120,90,20,.2); border:6px solid #fff; }
  .carta .verso { background:#ff8c1a radial-gradient(circle, #ffb65c 0 22%, transparent 23%) 0 0/34px 34px; }
  .carta .frente { background:#fff; transform:rotateY(180deg); padding:8%; display:flex; }
  .carta .frente svg { width:100%; height:100%; overflow:visible; }
  .carta.par .frente { background:#e3f7d6; }
  .lab { width:100%; height:100%; display:block; touch-action:none; cursor:pointer; }
  .andante { transition:transform .22s ease-out; }
  .anel { fill:none; stroke:#fff; stroke-width:6; opacity:.85; animation:pulsa 1s ease-in-out infinite;
    transform-box:fill-box; transform-origin:center; }
  @media (orientation:portrait) { #menu-jogos.m-brincar .cartao { width:min(40vw,30vh); } }
  @media (prefers-reduced-motion: reduce) { .passaro, .voa, .asas { animation:none; } }

  /* ===== fases do Brincar ===== */
  .a-fases { background:#fff0cc; }
  .grade-fases { position:absolute; inset:0; display:grid; grid-template-columns:repeat(5, auto); gap:4vh 3vw;
    align-content:center; justify-content:center; }
  .fase { width:min(13vw,25vh); aspect-ratio:1; border-radius:50%; border:6px solid #fff; font:inherit; font-weight:800;
    font-size:min(6.5vw,12vh); line-height:1; color:#fff; background:#4fbf5a; box-shadow:0 8px 0 #2f8f3c; cursor:pointer;
    position:relative; padding:0; }
  .fase.feita { background:#ffb800; box-shadow:0 8px 0 #c98a00; }
  .fase.feita::after { content:'★'; position:absolute; top:-16%; right:-8%; font-size:.5em; color:#fff;
    background:#ff6b5e; border-radius:50%; width:1.5em; height:1.5em; display:flex; align-items:center; justify-content:center; border:3px solid #fff; }
  .fase.atual { animation:pulsa 1.2s ease-in-out infinite; }
  .fase.trancada { background:#d5dbe0; box-shadow:0 8px 0 #b0b9c1; color:#f4f6f8; }
  .fujao { width:calc(min(22vh,18vw) * var(--tam, 1)); }
  .fujao svg { transition:opacity .25s; }
  .fujao.some { pointer-events:none; } .fujao.some svg { opacity:0; }
  .balao { width:calc(min(19vh,15vw) * var(--tam, 1)); }
  @media (orientation:portrait) { .fase { width:min(16vw,12vh); font-size:min(8vw,6vh); } }

  #btn-mundo { position:fixed; left:198px; top:14px; z-index:6; width:78px; height:78px; border-radius:50%; border:6px solid #fff;
    background:#3a9bf0; box-shadow:0 6px 0 #1f6fc0, 0 12px 18px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center;
    font-size:40px; line-height:1; text-decoration:none; animation:pulsa 1.6s ease-in-out infinite; }
</style>
</head>
<body>

<div id="inicio">
  <h1>Fazendinha</h1>
  <p>Bichinhos do Brasil</p>
  <button id="play" aria-label="Começar">
    <svg width="46%" viewBox="0 0 100 100"><path d="M30 18 L84 50 L30 82 Z" fill="#fff" stroke="#fff" stroke-width="10" stroke-linejoin="round"/></svg>
  </button>
  <div id="inicio-bichos"></div>
</div>
<button id="tela-cheia" aria-label="Tela cheia"><svg viewBox="0 0 24 24" width="28"><path d="M4 9 V4 H9 M15 4 H20 V9 M20 15 V20 H15 M9 20 H4 V15" fill="none" stroke="#3a7bff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>
(() => {
  const svg = document.getElementById('cena');
  const flores = document.getElementById('flores');
  const ovosG = document.getElementById('ovos');
  let ctx = null, vozPt = null, noite = false, ovos = 0;

  // ---------- voz ----------
  function escolheVoz() {
    try {
      const vs = speechSynthesis.getVoices();
      const nota = v => {
        const l = (v.lang || '').replace('_', '-').toLowerCase();
        if (!l.startsWith('pt')) return -1;
        let n = l === 'pt-br' ? 10 : 0;
        if (/natural|neural|online/i.test(v.name)) n += 8;
        if (/google/i.test(v.name)) n += 6;
        if (/luciana|francisca|fernanda|thalita|leticia/i.test(v.name)) n += 5;
        if (/enhanced|premium|aprimorad/i.test(v.name)) n += 4;
        return n;
      };
      vozPt = vs.map(v => [nota(v), v]).filter(p => p[0] >= 0).sort((a, b) => b[0] - a[0])[0]?.[1] || null;
    } catch(e) {}
  }
  try { escolheVoz(); speechSynthesis.onvoiceschanged = escolheVoz; } catch(e) {}
  function fala(txt, atraso=0) {
    setTimeout(() => {
      try {
        speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(txt);
        u.lang = 'pt-BR'; if (vozPt) u.voice = vozPt;
        u.rate = 0.9; u.pitch = 1.08;
        speechSynthesis.speak(u);
      } catch(e) {}
    }, atraso);
  }

  // ---------- sons sintetizados ----------
  function tom(f1, f2, dur, tipo='sine', vol=.25, delay=0, filtro=null) {
    if (!ctx) return;
    const t = ctx.currentTime + delay;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = tipo; o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let no = o;
    if (filtro) { const f = ctx.createBiquadFilter(); f.type = filtro.tipo; f.frequency.value = filtro.f; f.Q.value = filtro.q || 1; o.connect(f); no = f; }
    no.connect(g); g.connect(ctx.destination);
    o.start(t); o.stop(t + dur + .05);
  }
  const sons = {
    vaca:     () => { tom(170,115,1.1,'sawtooth',.22,0,{tipo:'lowpass',f:700}); return 1100; },
    jumento:  () => { [0,.28,.56,.84].forEach((d,i)=>tom(i%2?280:560, i%2?240:500, .26,'square',.12,d,{tipo:'lowpass',f:1500})); return 1150; },
    porco:    () => { [0,.18,.36].forEach(d=>tom(230,130,.14,'sawtooth',.2,d,{tipo:'bandpass',f:600,q:2})); return 600; },
    galinha:  () => { [0,.1,.2].forEach(d=>tom(900,1150,.08,'triangle',.2,d)); tom(700,1200,.35,'triangle',.2,.32); return 750; },
    cachorro: () => { [0,.22].forEach(d=>tom(520,240,.13,'square',.16,d,{tipo:'lowpass',f:1400})); return 500; },
    pato:     () => { [0,.2,.4].forEach(d=>tom(400,300,.16,'sawtooth',.22,d,{tipo:'bandpass',f:1200,q:5})); return 650; },
  };
  function plim(f=880) { tom(f, f*1.5, .18, 'sine', .2); tom(f*1.5, f*2, .2, 'sine', .15, .1); }
  function musiquinha() { [523,659,784,1047].forEach((f,i)=>tom(f,f,.18,'triangle',.18,i*.13)); }

  const frases = {
    vaca: ['Muuu! Eu sou a vaca!', 'A vaca faz muuu!', 'A vaca dá leite!'],
    jumento: ['Ió, ió! Eu sou o jumento!', 'O jumento faz ió!', 'O jumento é forte e trabalhador!'],
    porco: ['Óinc, óinc! Eu sou o porquinho!', 'O porco faz óinc!', 'O porquinho adora lama!'],
    galinha: [],
    cachorro: ['Au, au! Eu sou o Miguel!', 'O cachorro faz au au!', 'Au au! Vamos brincar?'],
    pato: ['Quá, quá! Eu sou o pato!', 'O pato nada no açude!', 'Quá, quá, quá!'],
  };
  const idx = {};
  const proxFrase = b => { const l = frases[b]; idx[b] = ((idx[b] ?? -1) + 1) % l.length; return l[idx[b]]; };

  // ---------- partículas ----------
  function particulas(x, y, cores=['#ff5c8a','#ffcf33','#5cc6ff','#7ed957'], simb=['♥','★','♪']) {
    for (let i = 0; i < 6; i++) {
      const p = document.createElement('div');
      p.className = 'particula';
      p.textContent = simb[i % simb.length];
      p.style.color = cores[i % cores.length];
      p.style.left = x + 'px'; p.style.top = y + 'px';
      p.style.setProperty('--dx', (Math.random()*200-100) + 'px');
      p.style.animationDelay = (i*0.06) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 1600);
    }
  }
  function svgPt(ev) {
    const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  const NS = 'http://www.w3.org/2000/svg';
  const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

  // ---------- bichos ----------
  const ocupado = new WeakSet();
  document.querySelectorAll('.bicho').forEach(b => {
    b.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      const nome = b.dataset.bicho;
      const corpo = b.querySelector('.corpo');
      corpo.classList.remove('pula'); void corpo.getBBox(); corpo.classList.add('pula');
      setTimeout(() => corpo.classList.remove('pula'), 750);
      particulas(ev.clientX, ev.clientY);
      if (ocupado.has(b)) return;
      ocupado.add(b); setTimeout(() => ocupado.delete(b), 500);
      const dur = sons[nome]();
      if (nome === 'galinha') { botaOvo(dur); return; }
      if (noite && Math.random() < .5) { fala('Ué! Acordei! ' + proxFrase(nome), dur); return; }
      fala(proxFrase(nome), dur);
    });
  });

  // ---------- galinha: contar ovos ----------
  const numeros = ['Um ovo!', 'Dois ovos!', 'Três ovos!', 'Quatro ovos!', 'Cinco ovos! Muito bem!'];
  function botaOvo(dur) {
    if (ovos >= 5) {
      ovosG.innerHTML = ''; ovos = 0;
      fala('Có, có, có! Vamos contar de novo?', dur);
      return;
    }
    const x = 120 + ovos * 46;
    const g = el('g', { transform: `translate(${x},868)` });
    const ovo = el('ellipse', { class: 'ovo', cx: 0, cy: 0, rx: 18, ry: 24, fill: '#fffaf0', stroke: '#e6d2ae', 'stroke-width': 3 });
    g.appendChild(ovo); ovosG.appendChild(g);
    fala(numeros[ovos], dur);
    ovos++;
  }

  // ---------- flores com nome das cores ----------
  const cores = [
    ['#e8343a','Flor vermelha!'], ['#ffcf33','Flor amarela!'], ['#3a7bff','Flor azul!'],
    ['#ff7ab6','Flor rosa!'], ['#9b5de5','Flor roxa!'], ['#ff8c1a','Flor laranja!'], ['#ffffff','Flor branca!']
  ];
  let ultimaCor = -1;
  function plantaFlor(x, y, falar=true) {
    let i; do { i = Math.floor(Math.random()*cores.length); } while (i === ultimaCor);
    ultimaCor = i;
    const [cor, nome] = cores[i];
    const g = el('g', { transform: `translate(${x},${y})` });
    const f = el('g', { class: 'flor' });
    f.appendChild(el('path', { d: 'M0 0 V-45', stroke: '#2f8a3a', 'stroke-width': 6, 'stroke-linecap': 'round' }));
    f.appendChild(el('ellipse', { cx: -12, cy: -20, rx: 12, ry: 6, fill: '#2f8a3a', transform: 'rotate(-30 -12 -20)' }));
    for (let k = 0; k < 6; k++) {
      const a = k * 60;
      f.appendChild(el('ellipse', { cx: 0, cy: -63, rx: 10, ry: 17, fill: cor, transform: `rotate(${a} 0 -50)` }));
    }
    f.appendChild(el('circle', { cx: 0, cy: -50, r: 10, fill: '#ffb21c', stroke: '#f08a1c', 'stroke-width': 3 }));
    g.appendChild(f); flores.appendChild(g);
    while (flores.children.length > 30) flores.firstChild.remove();
    plim(660 + i * 60);
    if (falar) fala(nome, 150);
  }
  svg.addEventListener('pointerdown', ev => {
    const p = svgPt(ev);
    if (p.y > 575 && ev.target.closest('.bicho') === null) {
      plantaFlor(p.x, p.y + 20);
      particulas(ev.clientX, ev.clientY, ['#ffcf33','#7ed957'], ['✿','★']);
    }
  });

  // ---------- sol / lua ----------
  document.getElementById('sol').addEventListener('pointerdown', ev => {
    ev.stopPropagation();
    noite = !noite;
    document.body.classList.toggle('noite', noite);
    if (noite) { [784,659,523,392].forEach((f,i)=>tom(f,f,.3,'sine',.15,i*.25)); fala('Boa noite! Hora de dormir. Shhh...', 300); }
    else { musiquinha(); fala('Bom dia! O sol chegou!', 500); }
  });

  // ---------- nuvens: chuva ----------
  document.querySelectorAll('.nuvem').forEach(n => {
    n.addEventListener('pointerdown', ev => {
      ev.stopPropagation();
      const r = n.getBoundingClientRect();
      for (let i = 0; i < 40; i++) {
        const d = document.createElement('div');
        d.className = 'gota';
        d.style.left = (r.left + Math.random() * r.width) + 'px';
        d.style.top = (r.bottom - 10) + 'px';
        d.style.animationDelay = (Math.random() * 1.4) + 's';
        document.body.appendChild(d);
        setTimeout(() => d.remove(), 2600);
      }
      for (let i = 0; i < 10; i++) tom(1200 + Math.random()*800, 600, .08, 'sine', .08, Math.random()*1.5);
      fala('Olha a chuva! Plic, ploc!', 200);
      setTimeout(() => {
        const cx = svgPt({ clientX: r.left + r.width/2, clientY: 0 }).x;
        [-60, 0, 60].forEach((dx, k) => setTimeout(() => plantaFlor(cx + dx, 640 + Math.random()*40, false), k*200));
      }, 2000);
    });
  });

  // ================= MODO APRENDER =================
  const $ = id => document.getElementById(id);
  const apr = $('aprender'), opcoesEl = $('opcoes'), dicaEl = $('dica'), estrelasEl = $('estrelas-jogo'), menuEl = $('menu-jogos');
  const rnd = n => Math.floor(Math.random() * n);
  const mistura = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const essa = art => (art.startsWith('a ') ? 'Essa é ' : 'Esse é ') + art + '.';

  // ----- desenhos dos cartões -----
  const VB = { vaca:'-112 -262 224 266', jumento:'-106 -316 200 320', galinha:'-72 -160 144 164',
               porco:'-92 -176 190 180', cachorro:'-82 -186 172 190', pato:'-78 -122 164 124' };
  const ARTIGO = { vaca:'a vaca', jumento:'o jumento', galinha:'a galinha', porco:'o porco', cachorro:'o cachorro', pato:'o pato' };
  function svgBicho(n) {
    const s = el('svg', { viewBox: VB[n] });
    const c = document.querySelector(`[data-bicho=${n}] .corpo`).cloneNode(true);
    c.classList.remove('pula'); c.querySelector('.zzz')?.remove();
    s.appendChild(c); return s;
  }
  function svgFlor(cor) {
    const s = el('svg', { viewBox: '-45 -92 90 96' }), f = el('g', { class: 'corpo' });
    f.appendChild(el('path', { d: 'M0 0 V-45', stroke: '#2f8a3a', 'stroke-width': 6, 'stroke-linecap': 'round' }));
    f.appendChild(el('ellipse', { cx: -12, cy: -20, rx: 12, ry: 6, fill: '#2f8a3a', transform: 'rotate(-30 -12 -20)' }));
